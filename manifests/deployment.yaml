apiVersion: apps/v1
kind: Deployment
metadata:
  name: meu-app-web
  namespace: argo-cd-lab
spec:
  replicas: 8
  selector:
    matchLabels:
      app: meu-app-web
  template:
    metadata:
      labels:
        app: meu-app-web
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: meu-app-web-svc
  namespace: argo-cd-lab
spec:
  type: ClusterIP
  selector:
    app: meu-app-web
  ports:
  - port: 80
    targetPort: 80
