apiVersion: apps/v1
kind: Deployment
metadata:
  name: novo-servico-app
  namespace: argo-cd-lab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: novo-servico
  template:
    metadata:
      labels:
        app: novo-servico
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80