apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: lab-nginx
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/leonelzacheo/lab-devops-argocd-ia.git'
    targetRevision: HEAD
    path: manifests
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argo-cd-lab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
