apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: meu-app-web
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/leonelzacheo/lab-devops-argocd-ia.git'
    targetRevision: main
    path: manifests
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: argo-cd-lab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
